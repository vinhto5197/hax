# The production box: one host, one origin. Caddy terminates TLS and routes by
# path; only caddy publishes ports. Postgres and object storage are managed
# services here (RDS, S3) — compose.prod.local.yml supplies stand-ins for a laptop.
# ${...} below are interpolated from the shell or --env-file, not from env_file.
# Images are pulled by tag; compose.prod.local.yml adds the build recipes.
name: hax
# Per-service log cap, so the running box gets it on the next roll even where
# the daemon-level default in user-data.sh was written after dockerd started.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  caddy:
    <<: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set the public hostname, e.g. hax-demo.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates + ACME account; losing it means re-issuing and
      # risking Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }

  api:
    <<: *logging
    image: ${HAX_PYTHON_IMAGE:-hax-python}
    restart: unless-stopped
    env_file: ${HAX_ENV_FILE:-/opt/hax/.env}
    # The owner-role URL is in the shared .env for migrate only; blanked here
    # (environment overrides env_file) so a compromised long-lived container
    # holds no credential that can disable RLS. session.py falls back to
    # DATABASE_URL when it is empty.
    environment:
      MIGRATIONS_DATABASE_URL: ""
    # --forwarded-allow-ips=*: api:8000 is published nowhere, so the only
    # client that can reach it is caddy (and web, which sends no forwarding
    # headers); trusting every immediate peer is trusting caddy. Caddy replaces
    # any client-sent X-Forwarded-For with the real peer address, so
    # request.client.host — the key the rate limits use — is the visitor and
    # cannot be spoofed from outside.
    command: >
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips=*
    # The image has no curl/wget.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ["8000"]

  worker:
    <<: *logging
    image: ${HAX_PYTHON_IMAGE:-hax-python}
    restart: unless-stopped
    env_file: ${HAX_ENV_FILE:-/opt/hax/.env}
    environment:
      MIGRATIONS_DATABASE_URL: ""
    # The embedded beat is for a single worker (a second one needs its own
    # separate beat process). The schedule file lives in /tmp because /app is
    # read-only for the hax user; it only records last-run times, so losing
    # it on a restart merely waits for the next tick.
    command: >
      celery -A apps.worker.celery_app worker --beat
      --schedule /tmp/celerybeat-schedule --loglevel=info --concurrency=2
    # A parse that outgrows its budget dies inside this fence (the kernel
    # kills the child, the celery parent lives) instead of starving the box.
    mem_limit: 1g
    # A deploy recreates this container; give in-flight tasks the full
    # task_time_limit (300 s) to finish instead of the 10 s default kill.
    stop_grace_period: 330s
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # One-shot: schema to head before api/worker start. Needs
  # MIGRATIONS_DATABASE_URL (the owner role); the app role cannot run DDL.
  migrate:
    <<: *logging
    image: ${HAX_PYTHON_IMAGE:-hax-python}
    env_file: ${HAX_ENV_FILE:-/opt/hax/.env}
    command: alembic -c alembic.ini upgrade head
    restart: "no"

  web:
    <<: *logging
    image: ${HAX_WEB_IMAGE:-hax-web}
    restart: unless-stopped
    env_file: ${HAX_ENV_FILE:-/opt/hax/.env}
    # Next's server reads only AUTH_* / API_INTERNAL_URL / INTERNAL_API_SECRET;
    # the rest of .env is blanked so the largest unauthenticated surface holds
    # no database, model or mail credential.
    environment:
      MIGRATIONS_DATABASE_URL: ""
      DATABASE_URL: ""
      REDIS_URL: ""
      ANTHROPIC_API_KEY: ""
      VOYAGE_API_KEY: ""
      SMTP_PASSWORD: ""
    expose: ["3000"]

  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: Redis is the Celery broker, and an evicted queue message is a
    # lost job. Memory stays bounded by the API's own caps (enqueue backlog,
    # rate-limit key TTLs), not by eviction.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data: {}
  caddy_config: {}
  redis_data: {}
