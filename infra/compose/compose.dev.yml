# Pinned project name: compose would otherwise derive it from this folder's
# name, and renaming the folder would orphan the running containers.
name: hax-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hax-postgres
    environment:
      POSTGRES_USER: hax
      POSTGRES_PASSWORD: hax
      POSTGRES_DB: hax
    ports:
      # Bind to loopback only: the short form "5432:5432" binds 0.0.0.0, exposing
      # Postgres (creds hax/hax) to the whole LAN. Containers reach each other via
      # the compose network, not this published port, so this is non-breaking.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hax -d hax"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hax-redis
    ports:
      # Loopback only — Redis runs with no auth; don't expose it to the LAN.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  s3:
    # S3-compatible object storage for raw uploaded files (RustFS). boto3
    # talks to this in dev and real AWS S3 in prod — same client, swapped
    # endpoint (the Postgres↔RDS dev/prod-parity pattern). Pinned by version
    # and digest: MinIO's images vanished from the public registries in 2026
    # (ADR 0013 addendum), so nothing here floats.
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: hax-s3
    environment:
      # Dev root creds — must match S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in
      # .env.
      RUSTFS_ACCESS_KEY: hax
      RUSTFS_SECRET_KEY: haxhaxhax
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      # Loopback only — dev object storage, no LAN exposure.
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console (http://localhost:9001/rustfs/console/index.html)
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    # Dev SMTP sink + inbox (http://localhost:8025). The worker's send_email
    # task points at it via SMTP_HOST/SMTP_PORT; prod swaps the env for a real
    # relay, same code path.
    image: axllent/mailpit:v1.27.0
    container_name: hax-mailpit
    ports:
      # Loopback only — a dev inbox must not be readable from the LAN.
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

# The first two names predate the project name and are kept so existing dev
# data survives; a fresh clone simply creates them under these names.
volumes:
  postgres_data: { name: docker-compose_postgres_data }
  redis_data: { name: docker-compose_redis_data }
  s3_data: { name: hax_s3_data }
