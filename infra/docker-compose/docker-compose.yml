services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hax-postgres
    environment:
      POSTGRES_USER: hax
      POSTGRES_PASSWORD: hax
      POSTGRES_DB: hax
    ports:
      # Bind to loopback only: the short form "5432:5432" binds 0.0.0.0, exposing
      # Postgres (creds hax/hax) to the whole LAN. Containers reach each other via
      # the compose network, not this published port, so this is non-breaking.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hax -d hax"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hax-redis
    ports:
      # Loopback only — Redis runs with no auth; don't expose it to the LAN.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # S3-compatible object storage for raw uploaded files (slice 2a). boto3
    # talks to this in dev and real AWS S3 in prod — same client, swapped
    # endpoint (the Postgres↔RDS dev/prod-parity pattern).
    image: minio/minio
    container_name: hax-minio
    environment:
      # Dev root creds — must match AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in
      # .env. MinIO requires the password to be >=8 chars.
      MINIO_ROOT_USER: hax
      MINIO_ROOT_PASSWORD: haxhaxhax
    ports:
      # Loopback only — dev object storage, no LAN exposure.
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
