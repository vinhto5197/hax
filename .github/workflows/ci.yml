name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token can only read the repo unless a job says otherwise (the deploy
# job adds packages and the OIDC token). Actions are pinned to commits, not
# version tags: a tag is a pointer its owner can move, and the deploy job's
# actions run with a role that is a root shell on the box.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pin exact: must match .pre-commit-config.yaml rev + pyproject dev dep,
        # or the formatter diverges (local-green / CI-red). Bump all three together.
        run: pip install "ruff==0.15.0"
      - name: Ruff
        run: ruff check . && ruff format --check .
      # The lane tooling's own tests: the gate lock and the worktree helper
      # guard a shared test database and an rm -rf, so they run here too.
      - name: Shell tests
        run: for t in tests/scripts/*.sh; do bash "$t"; done
      # The box fetches these two files at the deployed sha; a syntax error in
      # either would be found by the roll, after the images were built.
      - name: Validate the production compose file and Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/compose/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS=example.com caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          HAX_ENV_FILE="$PWD/.env.prod.example" SITE_ADDRESS=example.com \
            docker compose -f infra/compose/compose.prod.yml config -q

  test:
    runs-on: ubuntu-latest
    services:
      # Same image as dev compose. The suite creates the hax_test DB, the
      # hax_app role, and runs migrations itself (tests/api/conftest.py).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hax
          POSTGRES_PASSWORD: hax
          POSTGRES_DB: hax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hax -d hax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match local dev (.venv is 3.14): the suite must run on the same
          # interpreter it develops on, not lint's floor version.
          python-version: "3.14.8"
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Every installed package is pinned
        run: pip freeze --exclude-editable | scripts/check_constraints.sh constraints.txt
      # fakeredis stands in for Redis; Postgres is the service above (the authz
      # suite needs real RLS/pgvector); conftest.py hard-assigns env secrets.
      - name: Pytest
        run: python -m pytest -W error
      # Generated-types drift: the committed apps/web/lib/openapi.ts must be
      # what the current API emits. A backend change that skipped `make types`
      # fails here instead of at runtime in the browser.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generated types are current
        env:
          AUTH_SECRET: ci-not-a-real-secret-padding-32ch
          INTERNAL_API_SECRET: ci-not-a-real-secret
        run: |
          python -m apps.api.utils.export_openapi
          cd apps/web && npm ci && npm run generate:types
          git diff --exit-code -- lib/openapi.ts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/web
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: ESLint
        run: npm run lint
        working-directory: apps/web
      - name: Vitest
        run: npm test
        working-directory: apps/web
      - name: Prettier
        # Same version and file set as the pre-commit hook; run from the repo
        # root so .prettierignore (generated files) applies.
        run: npx prettier@3.3.3 --check "apps/web/**/*.{ts,tsx,js,jsx,mjs,mts,css,json,md}"

  # Browser journeys (make e2e) against the same isolated stack as a laptop:
  # Postgres and Redis as services, the API and a production web build started
  # by Playwright, a scripted model in place of Anthropic. A failure uploads
  # the Playwright report and traces; nothing else leaves the runner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hax
          POSTGRES_PASSWORD: hax
          POSTGRES_DB: hax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hax -d hax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # The journeys' uploads; the same pin as infra/compose/compose.dev.yml.
      s3:
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: hax
          RUSTFS_SECRET_KEY: haxhaxhax
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The journeys' mail; the same pin as infra/compose/compose.dev.yml.
      mailpit:
        image: axllent/mailpit:v1.27.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.8"
      # The Makefile and playwright.config.ts call .venv/bin/python.
      - name: Install Python dependencies
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]" -c constraints.txt
      - name: Every installed package is pinned
        run: .venv/bin/pip freeze --exclude-editable | scripts/check_constraints.sh constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # System libraries are not cached; --with-deps installs them every run
      # and skips the browser download when the cache hit.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Journeys
        run: make e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Pull requests: prove both images build on the box's architecture. On main
  # the deploy job builds them (deploy.sh all), so nothing builds twice.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images
        run: |
          docker build --platform linux/arm64 -f infra/docker/python.Dockerfile -t hax-python:latest .
          docker build --platform linux/arm64 -f infra/docker/web.Dockerfile --build-arg NEXT_PUBLIC_API_URL= -t hax-web:latest .

  # Every push to main that passes the checks rolls the box. The job holds no
  # AWS key: it assumes the deploy role with its OIDC token (infra/terraform/ci.tf).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, web, e2e]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # The concurrency group serializes deploys but does not order them: two
      # close pushes can finish their checks in either order, and a re-run of
      # an old run keeps its old sha. Only the tip of main may roll; anything
      # else is superseded and exits green having done nothing. A deliberate
      # rollback is `deploy.sh roll <sha>` from a laptop, which never comes
      # through here.
      - name: Still the tip of main?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "superseded: main is at ${tip:0:7}, this run is ${GITHUB_SHA:0:7}; not deploying"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
        id: tip
      - name: Build, push, roll
        if: steps.tip.outputs.superseded != 'true'
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HAX_INSTANCE_ID: ${{ vars.HAX_INSTANCE_ID }}
          # A CI build is always the clean commit, so re-running a failed run
          # may legitimately re-push the same sha; the immutability guard is
          # for laptops.
          DEPLOY_OVERWRITE: "1"
        run: infra/deploy/deploy.sh all
