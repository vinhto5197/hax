name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token can only read the repo unless a job says otherwise (the deploy
# job adds packages and the OIDC token). Actions are pinned to commits, not
# version tags: a tag is a pointer its owner can move, and the deploy job's
# actions run with a role that is a root shell on the box.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The repo is public: what this push or PR adds must not carry the
      # maintainer's personal details. The denylist is a repository secret;
      # without it the check says it skipped. Logs show only file:line.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Pin exact: ruff must match .pre-commit-config.yaml rev + pyproject dev
      # dep, or the formatter diverges (local-green / CI-red); PyYAML matches
      # constraints.txt and is what tests/scripts/test_make_ci.sh reads ci.yml with.
      - name: Install ruff and PyYAML
        run: pip install "ruff==0.15.0" "PyYAML==6.0.3"
      # Every check this job runs lives in `make ci-lint` (Makefile), so the
      # local `make ci` runs the same commands: the personal-details check
      # (CI logs are public: it prints file:line only), ruff, the lane
      # tooling's shell tests, the workflow tests, and the compose/Caddyfile
      # validation.
      - name: Lint and tooling checks
        env:
          PERSONAL_DENYLIST: ${{ secrets.PERSONAL_DENYLIST }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make ci-lint RUFF=ruff

  test:
    runs-on: ubuntu-latest
    services:
      # Same image as dev compose. The suite creates the hax_test DB, the
      # hax_app role, and runs migrations itself (tests/api/conftest.py).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hax
          POSTGRES_PASSWORD: hax
          POSTGRES_DB: hax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hax -d hax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 3.14.8 is not in the runner's tool cache: the action downloads it and
      # upgrades pip from PyPI, which can fail transiently ("No matching
      # distribution found for pip"). The step below repeats it only after a
      # failure, so a retried run is green with one red step; a job with a
      # 3.14 setup keeps this pair (tests/scripts/test_ci_python_setup.sh).
      # The pip cache only saves download time: the install still resolves
      # against PyPI.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py
        continue-on-error: true
        with:
          # Match local dev (.venv is 3.14): the suite must run on the same
          # interpreter it develops on, not lint's floor version.
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.py.outcome == 'failure'
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      # `make ci-test`: every package pinned, Pyright, pytest (fakeredis stands in for
      # Redis; Postgres is the service above, for real RLS/pgvector), and the
      # generated-types drift check (the committed apps/web/lib/openapi.ts must
      # be what the current API emits).
      - name: Pins, Pyright, pytest and generated types
        run: make ci-test PY=python

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/web
      # `make ci-web`: type-check, ESLint, Vitest, and Prettier from the repo
      # root (where .prettierignore applies).
      - name: Type-check, lint, unit tests and formatting
        run: make ci-web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hax
          POSTGRES_PASSWORD: hax
          POSTGRES_DB: hax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hax -d hax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # The journeys' uploads; the same pin as infra/compose/compose.dev.yml.
      s3:
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: hax
          RUSTFS_SECRET_KEY: haxhaxhax
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The journeys' mail; the same pin as infra/compose/compose.dev.yml.
      mailpit:
        image: axllent/mailpit:v1.27.0
        ports:
          - 1026:1025
          - 8026:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The same retried, cached pair as the test job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py
        continue-on-error: true
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.py.outcome == 'failure'
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      # The Makefile and playwright.config.ts call .venv/bin/python.
      - name: Install Python dependencies
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]" -c constraints.txt
      - name: Every installed package is pinned
        run: make ci-pins
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # System libraries are not cached; --with-deps installs them every run
      # and skips the browser download when the cache hit.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Journeys
        run: make e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Pull requests: prove both images build on the box's architecture. On main
  # the deploy job builds them (deploy.sh all), so nothing builds twice.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images
        run: |
          docker build --platform linux/arm64 -f infra/docker/python.Dockerfile -t hax-python:latest .
          docker build --platform linux/arm64 -f infra/docker/web.Dockerfile --build-arg NEXT_PUBLIC_API_URL= -t hax-web:latest .

  # Every push to main that passes the checks rolls the box. The job holds no
  # AWS key: it assumes the deploy role with its OIDC token (infra/terraform/ci.tf).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, web, e2e]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # The concurrency group serializes deploys but does not order them: two
      # close pushes can finish their checks in either order, and a re-run of
      # an old run keeps its old sha. Only the tip of main may roll; anything
      # else is superseded and exits green having done nothing. A deliberate
      # rollback is `deploy.sh roll <sha>` from a laptop, which never comes
      # through here.
      - name: Still the tip of main?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "superseded: main is at ${tip:0:7}, this run is ${GITHUB_SHA:0:7}; not deploying"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
        id: tip
      - name: Build, push, roll
        if: steps.tip.outputs.superseded != 'true'
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HAX_INSTANCE_ID: ${{ vars.HAX_INSTANCE_ID }}
          # A CI build is always the clean commit, so re-running a failed run
          # may legitimately re-push the same sha; the immutability guard is
          # for laptops.
          DEPLOY_OVERWRITE: "1"
        run: infra/deploy/deploy.sh all
