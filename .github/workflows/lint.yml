name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pin exact: must match .pre-commit-config.yaml rev + pyproject dev dep,
        # or the formatter diverges (local-green / CI-red). Bump all three together.
        run: pip install "ruff==0.15.0"

      - name: Ruff
        run: ruff check . && ruff format --check .
