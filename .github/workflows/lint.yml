name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pin exact: must match .pre-commit-config.yaml rev + pyproject dev dep,
        # or the formatter diverges (local-green / CI-red). Bump all three together.
        run: pip install "ruff==0.15.0"

      - name: Ruff
        run: ruff check . && ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      # Same image as dev compose. The suite creates the hax_test DB, the
      # hax_app role, and runs migrations itself (tests/api/conftest.py).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hax
          POSTGRES_PASSWORD: hax
          POSTGRES_DB: hax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hax -d hax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match local dev (.venv is 3.14): the suite must run on the same
          # interpreter it develops on, not lint's floor version.
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # fakeredis stands in for Redis; Postgres is the service above (the authz
      # suite needs real RLS/pgvector); conftest.py hard-assigns env secrets.
      - name: Pytest
        run: python -m pytest -W error
