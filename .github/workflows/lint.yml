name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "black>=24.3.0" "ruff>=0.6.0"

      - name: Black
        run: black --check .

      - name: Ruff
        run: ruff check . && ruff format --check .
