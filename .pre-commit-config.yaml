repos:
  # Generic file hygiene — formatting fixes, common foot-guns
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Python: lint + auto-fix + format (matches ruff config in pyproject.toml)
  # Pin EXACTLY to the same ruff as CI + pyproject — ruff's formatter changes
  # between versions, so a floating/older pin reformats files the other side
  # then rejects (a local-green / CI-red skew). Bump all three together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Frontend: prettier for formatting TS/CSS/JSON/MD
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|mts|css|json|md)$

  # Frontend: ESLint runs via the project's own npm script,
  # so it picks up eslint-config-next and all its plugins correctly.
  - repo: local
    hooks:
      # The repo is public: no added line may carry the maintainer's name or
      # email (denylist in the gitignored local/personal-denylist.txt).
      - id: personal-info
        name: no personal details in added lines
        entry: scripts/check_personal.sh --staged
        language: system
        pass_filenames: false
        always_run: true
      # The whole tree, not the staged files: a change in one module can
      # break the types of another, and a pin or config change alone can
      # change the verdict. --pythonpath as in `make types-check`; needs the
      # project's .venv (`make setup`).
      - id: pyright
        name: pyright (apps, packages)
        entry: env PYRIGHT_PYTHON_IGNORE_WARNINGS=1 .venv/bin/pyright
        args: [--pythonpath, .venv/bin/python]
        language: system
        files: (\.pyi?|^pyproject\.toml|^constraints\.txt)$
        pass_filenames: false
      - id: eslint
        name: eslint (apps/web)
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|mts)$
        pass_filenames: false
      - id: vitest
        name: vitest (apps/web)
        entry: bash -c 'cd apps/web && npm test'
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|mts|json)$
        pass_filenames: false
      # Screenshots, traces and recordings from test or browser runs are
      # never committed (the repo is public); the repo tracks no image today.
      # A deliberate asset gets an `exclude:` path here, reviewed.
      - id: no-test-artifacts
        name: no screenshots, traces or recordings
        entry: test artifacts must not be committed
        language: fail
        files: (?i)\.(png|jpe?g|gif|webp|avif|heic|webm|mp4|mov|mkv|zip|har)$
