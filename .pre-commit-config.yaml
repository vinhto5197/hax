repos:
  # Generic file hygiene — formatting fixes, common foot-guns
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Python: lint + auto-fix + format (matches ruff config in pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Frontend: prettier for formatting TS/CSS/JSON/MD
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|css|json|md)$

  # Frontend: ESLint runs via the project's own npm script,
  # so it picks up eslint-config-next and all its plugins correctly.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false
