[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "apps.api*"]
exclude = ["apps.web*"]

[project]
name = "hax"
version = "0.1.0"
description = "Local dev configuration for hax."
requires-python = ">=3.11"
dependencies = [
  # API
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  # LLM
  "anthropic>=0.40.0",
  "claude-agent-sdk>=0.1.0",
  # LangChain
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-community>=0.3.0",
  # Async tasks
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  # DB
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "pgvector>=0.3.0",
  "alembic>=1.14.0",
  # Config and HTTP
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
respect-gitignore = true
src = ["apps", "packages"]
extend-exclude = [
  "apps/web",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]
